name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify lockfile registries
        run: node scripts/verify-pnpm-lockfile.js

      - name: Authenticate to the internal Atlassian npm registry
        # `@atlassian/logo-third-party` (Platform Labs) is internal-only and not in
        # the public npm-remote mirror, so it resolves from `atlassian-npm`, which
        # (unlike npm-remote) requires auth. The project `.npmrc` supplies the
        # registry mapping; this supplies the token, mirroring local `~/.npmrc`.
        run: echo "//packages.atlassian.com/artifactory/api/npm/atlassian-npm/:_authToken=${ATLASSIAN_NPM_TOKEN}" >> "$HOME/.npmrc"
        env:
          ATLASSIAN_NPM_TOKEN: ${{ secrets.ATLASSIAN_NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fast PR checks
        run: pnpm run ci:pr
