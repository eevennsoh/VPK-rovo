# Repo-owned Codex environment config. Keep setup aligned with
# .agents/hooks/setup-worktree.sh.
version = 1
name = "vpk-rovo"

[setup]
script = '''
set -euo pipefail

PROJECT_DIR="$CODEX_WORKTREE_PATH" \
SOURCE_TREE_PATH="$CODEX_SOURCE_TREE_PATH" \
bash "$CODEX_WORKTREE_PATH/.agents/hooks/setup-worktree.sh"
'''

[[actions]]
name = "pnpm  install"
icon = "run"
command = "pnpm install"

[[actions]]
name = "pnpm run dev"
icon = "run"
command = "pnpm run dev"

[[actions]]
name = "pnpm run dev:tmux:start"
icon = "run"
command = "pnpm run dev:tmux:start"

[[actions]]
name = "pnpm run rovo"
icon = "run"
command = "pnpm run rovo"

[[actions]]
name = "pnpm run rovo:tmux:start --1"
icon = "run"
command = "pnpm run rovo:tmux:start --1"

[[actions]]
name = "pnpm run rovo:tmux:stop"
icon = "run"
command = "pnpm run rovo:tmux:stop"

[[actions]]
name = "portless run"
icon = "tool"
command = "pnpm exec portless run $(node -e 'process.stdout.write(require(\"./scripts/lib/worktree-ports\").getPortlessRunArgs().join(\" \"))')"
