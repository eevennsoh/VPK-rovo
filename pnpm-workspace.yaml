packages:
  - .
  - backend
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - undici
  # Latest gooey effect engine requested before the seven-day maturity gate.
  - liquid-gooey@0.2.1
  # New shadcn headless primitives required for current shadcn/base components.
  - "@shadcn/react"
  # Dev-only tooling; took latest ahead of the 7-day gate by explicit request.
  - react-grab
  - "@react-grab/*"
  - agent-browser
  # ADS source-of-truth tokens; allow same-day design-system updates by request.
  - "@atlaskit/tokens"
  # Transitive runtime gate for current @atlaskit/tokens.
  - "@atlaskit/react-compiler-gating"
  # Trusted internal Platform Labs package (atlassian-npm, not public npm), so
  # the public-supply-chain release-age gate does not apply.
  - "@atlassian/logo-third-party"
  # Well-established security-header middleware; 8.3.0 taken ahead of the 7-day
  # gate by explicit request (minor CSP update). Version-pinned so the gate
  # re-applies automatically on any future helmet bump.
  - helmet@8.3.0
trustPolicy: no-downgrade
trustPolicyExclude:
  # Existing transitive dependency blocks lockfile refresh under no-downgrade.
  - semver@6.3.1
  # Existing transitive dependency blocks lockfile refresh under no-downgrade.
  - langium@3.3.1
  # Late 3.x backport (published after the attested 4.x line) lacks provenance;
  # pnpm's publish-date trust heuristic flags it as a downgrade. Not a takeover
  # (no advisory; maintained by un-ts). Pinned to the exact locked version so the
  # guard re-applies automatically on any future change.
  - eslint-import-resolver-typescript@3.10.1
  # Transitive of recharts; publish-date trust heuristic flags 5.1.1 as a
  # downgrade (lost provenance a later-published version carries). Reputable
  # (Redux/reselect), no advisory. Version-pinned so the guard re-applies on change.
  - reselect@5.1.1
  # Transitive of @pierre/diffs; latest lacks provenance attestations so the
  # publish-date trust heuristic flags it as a downgrade. Same maintainer set as
  # @pierre/diffs itself (pierre.co team), normal release cadence, no advisory.
  # Version-pinned so the guard re-applies on any future change.
  - "@pierre/theme@1.1.0"
# Dependency pinning tiers (see Engineering Standards in AGENTS.md):
#   Float   ^x.y.z  - stable libs; `pnpm update` may take patch + minor
#   Cautious ~x.y.z - libs where minors have broken us; patch only
#   Locked  x.y.z   - framework core + coordinated families; bump manually
# The catalog below holds Locked coordinated families that MUST move together.
# Reference them from package.json as "catalog:". Bump the version here once
# and every member updates in lockstep.
catalog:
  # tiptap - all @tiptap/* must share one version
  '@tiptap/core': 3.30.0
  '@tiptap/extension-code-block': 3.30.0
  '@tiptap/extension-color': 3.30.0
  '@tiptap/extension-highlight': 3.30.0
  '@tiptap/extension-link': 3.30.0
  '@tiptap/extension-list': 3.30.0
  '@tiptap/extension-mention': 3.30.0
  '@tiptap/extension-table': 3.30.0
  '@tiptap/extension-text-align': 3.30.0
  '@tiptap/extension-text-style': 3.30.0
  '@tiptap/extension-underline': 3.30.0
  '@tiptap/markdown': 3.30.0
  '@tiptap/pm': 3.30.0
  '@tiptap/react': 3.30.0
  '@tiptap/starter-kit': 3.30.0
  '@tiptap/suggestion': 3.30.0
  # json-render - published from one monorepo at a single version
  '@json-render/codegen': 0.19.0
  '@json-render/core': 0.19.0
  '@json-render/image': 0.19.0
  '@json-render/ink': 0.19.0
  '@json-render/react': 0.19.0
  '@json-render/react-pdf': 0.19.0
  '@json-render/react-three-fiber': 0.19.0
  '@json-render/remotion': 0.19.0
  '@json-render/yaml': 0.19.0
  # remotion - remotion + every @remotion/* must match exactly
  'remotion': 4.0.508
  '@remotion/player': 4.0.508
overrides:
  '@hono/node-server': ^1.19.10
  dompurify: ^3.4.11
  express-rate-limit: ^8.2.2
  fast-uri: 3.1.5
  hono: ^4.12.25
  lodash-es: ^4.18.1
  postcss: ^8.5.18
  qs: 6.15.2
  undici@^7.0.0: 7.28.0
  undici@^8.0.0: 8.5.0
  ws: ^8.21.0
allowBuilds:
  '@google/genai': false
  agent-browser: true
  better-sqlite3: false
  edgedriver: true
  esbuild: true
  geckodriver: true
  iframe-resizer: true
  msw: false
  node-llama-cpp: false
  protobufjs: true
  react-grab: true
  sharp: false
  tree-sitter-go: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  unrs-resolver: false
# Accept our intentionally bleeding-edge core versions for deps that still
# declare an older-major peer range. These are verified-working pairings (the
# app builds, lints, typechecks, and runs) — this silences the peer warning
# without downgrading. `pnpm update` cannot fix these; only widening the peer
# floor (here) or the upstream dep widening its declared range can.
peerDependencyRules:
  allowedVersions:
    react: ^18.2.0 || ^19.0.0
    react-dom: ^18.2.0 || ^19.0.0
    eslint: ^10.0.0
    typescript: ^6.0.0
    ink: ^7.0.0
    three: '>=0.183.0'
